name: Android CI

on:
  push:
    branches: [ "master", "v2" ]
  pull_request:
    branches: [ "master", "v2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: |
        echo '{ "project_info": { "project_number": "1234", "project_id": "test" }, "client": [ { "client_info": { "mobilesdk_app_id": "1:1234:android:1234", "android_client_info": { "package_name": "com.example.anonymouschat" } }, "oauth_client": [], "api_key": [ { "current_key": "test" } ], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } } ], "configuration_version": "1" }' > app/google-services.json
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: drift-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk